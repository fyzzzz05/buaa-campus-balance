<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<title>校园余额小组件</title>
<style>
  :root{
    --wbg:rgba(255,255,255,.78); --wink:#18212F; --wmut:#6A7587; --wacc:#2F5BEA; --won:#FFFFFF;
    --wwarn:#C2602D; --wbtn:rgba(24,33,47,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--wbg:rgba(30,36,50,.72);--wink:#EAEFF7;--wmut:#97A3B8;--wacc:#4C7BFF;--won:#0B1020;--wwarn:#F0A070;--wbtn:rgba(234,239,247,.09)}
  }
  html,body{height:100%;margin:0;background:transparent;overflow:hidden}
  *{box-sizing:border-box}
  body{font-family:"Microsoft YaHei UI","Segoe UI","PingFang SC",system-ui,sans-serif;color:var(--wink);-webkit-user-select:none;user-select:none}
  .w{
    position:relative;width:170px;height:170px;padding:14px;border-radius:24px;background:var(--wbg);
    border:1px solid rgba(255,255,255,.5);box-shadow:0 10px 30px rgba(20,30,70,.18);
    display:flex;flex-direction:column;overflow:hidden;
  }
  @media (prefers-color-scheme:dark){.w{border-color:rgba(255,255,255,.08)}}
  .drag{position:absolute;left:0;right:0;top:0;height:34px;-webkit-app-region:drag;cursor:grab;z-index:2}
  .body{-webkit-app-region:no-drag;display:flex;flex-direction:column;height:100%;cursor:pointer}
  .lab{font-size:12px;font-weight:500;color:var(--wmut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .val{margin-top:6px;font-weight:700;font-size:38px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .val i{font-style:normal;font-size:14px;font-weight:500;letter-spacing:0;margin-left:4px;color:var(--wmut)}
  .val.warn{color:var(--wwarn)}
  .sub{margin-top:8px;font-size:11px;color:var(--wmut);line-height:1.25;min-height:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .sub.warn{color:var(--wwarn)}
  .swap{animation:rise .4s cubic-bezier(.22,1,.36,1)}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .tabs{margin-top:auto;display:flex;justify-content:space-between;-webkit-app-region:no-drag}
  .tabs button{
    width:30px;height:30px;border-radius:50%;border:0;padding:0;cursor:pointer;display:grid;place-items:center;
    color:var(--wmut);background:var(--wbtn);transition:background .3s,color .3s,transform .15s;
  }
  .tabs button:hover{transform:scale(1.08)}
  .tabs button[aria-pressed="true"]{background:var(--wacc);color:var(--won)}
  .tabs button:focus-visible{outline:2px solid var(--wink);outline-offset:2px}
  .tabs svg{display:block}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="w" id="w" role="group" tabindex="0" aria-label="校园余额">
  <div class="drag"></div>
  <div class="body" id="body">
    <div class="lab"></div>
    <div class="val"><span class="num">—</span><i></i></div>
    <div class="sub"></div>
    <div class="tabs"></div>
  </div>
</div>
<script>
  var ICON = {
    card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
    wifi:'<path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/>',
    bulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
    snow:'<path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9L4.9 19.1"/>'
  };
  var METRICS = [
    {key:'card', n:'校园卡余额', u:'元', d:2, ic:'card'},
    {key:'network', n:'校园网流量余额', u:'GB', d:1, ic:'wifi'},
    {key:'lighting', n:'照明电费余额', u:'元', d:2, ic:'bulb'},
    {key:'air', n:'空调电费余额', u:'元', d:2, ic:'snow'}
  ];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var snapshot = null, selected = 0, displayed = 0, raf = 0;
  var root = document.getElementById('w'), body = document.getElementById('body');
  var lab = body.querySelector('.lab'), num = body.querySelector('.num'), unit = body.querySelector('.val i');
  var val = body.querySelector('.val'), sub = body.querySelector('.sub'), tabs = body.querySelector('.tabs');

  tabs.innerHTML = METRICS.map(function (m, k) {
    return '<button type="button" data-k="' + k + '" aria-label="' + m.n + '" aria-pressed="false">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[m.ic] + '</svg></button>';
  }).join('');
  var buttons = tabs.querySelectorAll('button');

  function restart(el) { el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); }
  function item(metric) { return snapshot && snapshot[metric] ? snapshot[metric] : null; }

  function fmt(value, digits) { return value === null || value === undefined ? '—' : Number(value).toFixed(digits); }

  function subtitle(metric, entry) {
    if (!snapshot || !entry || entry.value === null) return '打开 App 更新数据';
    var updated = Date.parse(entry.updatedAt || snapshot.updatedAt || '');
    if (entry.note === '更新失败' || (Number.isFinite(updated) && Date.now() - updated > 26 * 60 * 60 * 1000)) {
      var date = Number.isFinite(updated) ? new Date(updated) : null;
      return '上次更新 ' + (date ? (date.getMonth() + 1) + '/' + date.getDate() : '—');
    }
    if ((metric === 'lighting' || metric === 'air') && entry.value <= 10) return '余额偏低';
    return entry.note || '暂不可用';
  }

  function show(k, animate) {
    selected = k;
    var metric = METRICS[k], entry = item(metric.key);
    var value = entry && typeof entry.value === 'number' ? entry.value : null;
    var warn = value !== null && (metric.key === 'lighting' || metric.key === 'air') && value <= 10;
    root.setAttribute('aria-label', metric.n + ' ' + (value === null ? '暂无数据' : value.toFixed(metric.d) + ' ' + metric.u));
    lab.textContent = metric.n; unit.textContent = metric.u;
    val.classList.toggle('warn', warn); sub.classList.toggle('warn', warn);
    sub.textContent = subtitle(metric.key, entry);
    restart(lab); restart(sub);
    buttons.forEach(function (b, j) { b.setAttribute('aria-pressed', j === k ? 'true' : 'false'); });
    cancelAnimationFrame(raf);
    var from = displayed, to = value === null ? 0 : value;
    if (value === null) { num.textContent = '—'; displayed = 0; return; }
    var start = performance.now(), duration = (!animate || reduce) ? 0 : 550;
    (function step(now) {
      var p = duration ? Math.min(1, (now - start) / duration) : 1, e = 1 - Math.pow(1 - p, 4);
      displayed = from + (to - from) * e;
      num.textContent = displayed.toFixed(metric.d);
      if (p < 1) raf = requestAnimationFrame(step);
    })(start);
  }

  function apply(next) {
    snapshot = next;
    show(selected, false);
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function (event) {
      event.stopPropagation();
      var k = Number(b.dataset.k);
      if (k === selected) return;
      show(k, true);
    });
  });
  body.addEventListener('click', function (event) {
    if (event.target.closest('.tabs')) return;
    if (window.campusWidget) window.campusWidget.openMain(METRICS[selected].key);
  });
  body.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); if (window.campusWidget) window.campusWidget.openMain(METRICS[selected].key); }
    else if (event.key === 'ArrowRight') { event.preventDefault(); show((selected + 1) % METRICS.length, true); }
    else if (event.key === 'ArrowLeft') { event.preventDefault(); show((selected + METRICS.length - 1) % METRICS.length, true); }
  });

  if (window.campusWidget) {
    window.campusWidget.onSnapshot(apply);
    window.campusWidget.getSnapshot().then(apply).catch(function () { apply(null); });
  } else {
    apply(null);
  }
</script>
</body>
</html>
