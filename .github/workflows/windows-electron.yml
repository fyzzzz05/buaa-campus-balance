name: Windows Electron 构建
on:
  workflow_dispatch:
  push:
    tags:
      - 'win-v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer
        run: npm run electron:build:win
      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: campus-balance-windows-x64-v${{ steps.version.outputs.value }}
          path: dist-electron/*-setup.exe
          if-no-files-found: error
      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/win-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if [ -f "docs/releases/$TAG.md" ]; then
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --draft --latest=false --title "校园余额 Windows ${TAG#win-}" --notes-file "docs/releases/$TAG.md"
            fi
          else
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --draft --latest=false --title "校园余额 Windows ${TAG#win-}" --generate-notes
            fi
          fi
          gh release upload "$TAG" dist-electron/*-setup.exe --clobber
          gh release edit "$TAG" --draft=false --latest=false
