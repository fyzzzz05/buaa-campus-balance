name: Windows Electron 构建
on:
  workflow_dispatch:
  push:
    tags:
      - 'win-v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer
        run: npm run electron:build:win
      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: campus-balance-windows-x64-v${{ steps.version.outputs.value }}
          path: dist-electron/*-setup.exe
          if-no-files-found: error
      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/win-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          API="repos/$GITHUB_REPOSITORY/releases"
          # Remember the current latest release (the macOS one) before publishing.
          PREVIOUS_LATEST="$(gh api "$API/latest" --jq .id 2>/dev/null || true)"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "docs/releases/$TAG.md" ]; then
              gh release create "$TAG" --draft --title "校园余额 Windows ${TAG#win-}" --notes-file "docs/releases/$TAG.md"
            else
              gh release create "$TAG" --draft --title "校园余额 Windows ${TAG#win-}" --generate-notes
            fi
          fi
          gh release upload "$TAG" dist-electron/*-setup.exe --clobber
          gh release edit "$TAG" --draft=false
          # Windows builds must not take over the repository "latest" download entry.
          RELEASE_ID="$(gh api "$API/tags/$TAG" --jq .id)"
          gh api -X PATCH "$API/$RELEASE_ID" -f make_latest=false >/dev/null
          if [ -n "$PREVIOUS_LATEST" ] && [ "$PREVIOUS_LATEST" != "$RELEASE_ID" ]; then
            gh api -X PATCH "$API/$PREVIOUS_LATEST" -f make_latest=true >/dev/null
          fi
