name: 发布 macOS 版
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ./tests/run-native.sh
      - name: Require update signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: test -n "$SPARKLE_PRIVATE_KEY"
      - name: Build app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]
          DEVELOPER_DIR="$(xcode-select -p)" APP_VERSION="$VERSION" ./desktop/widget/build-with-widget.sh "$RUNNER_TEMP/校园余额-v$VERSION.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/校园余额-v$VERSION.app"
          APP="$RUNNER_TEMP/校园余额-v$VERSION.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")" = AppIcon
          iconutil -c iconset "$APP/Contents/Resources/AppIcon.icns" -o "$RUNNER_TEMP/verified-app.iconset"
          test -s "$RUNNER_TEMP/verified-app.iconset/icon_512x512@2x.png"
          test -d "$RUNNER_TEMP/校园余额-v$VERSION.app/Contents/PlugIns/CampusBalanceWidget.appex/Contents/Resources/Metadata.appintents"
          mkdir "$RUNNER_TEMP/dmg-content" "$RUNNER_TEMP/updates"
          cp -R "$RUNNER_TEMP/校园余额-v$VERSION.app" "$RUNNER_TEMP/dmg-content/"
          ln -s /Applications "$RUNNER_TEMP/dmg-content/Applications"
          hdiutil create -volname "校园余额 v$VERSION" -srcfolder "$RUNNER_TEMP/dmg-content" -format UDZO "$RUNNER_TEMP/updates/CampusBalance-v$VERSION-macOS-arm64.dmg"
      - name: Test update signatures and tamper rejection
        run: sh tests/run-update.sh "$RUNNER_TEMP/校园余额-v${GITHUB_REF_NAME#v}.app"
      - name: Sign and verify update feed
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SPARKLE_DIR="$(sh desktop/prepare-sparkle.sh)"
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_DIR/bin/generate_appcast" --ed-key-file - --maximum-deltas 0 --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" "$RUNNER_TEMP/updates"
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_DIR/bin/sign_update" --ed-key-file - --verify "$RUNNER_TEMP/updates/appcast.xml"
          swift desktop/verify-update.swift "$RUNNER_TEMP/校园余额-v$VERSION.app/Contents/Info.plist" "$RUNNER_TEMP/updates/appcast.xml" "$RUNNER_TEMP/updates/CampusBalance-v$VERSION-macOS-arm64.dmg" "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            gh release create "$GITHUB_REF_NAME" --draft --title "校园余额 ${GITHUB_REF_NAME}" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "校园余额 ${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/updates/CampusBalance-v${GITHUB_REF_NAME#v}-macOS-arm64.dmg" "$RUNNER_TEMP/updates/appcast.xml"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
