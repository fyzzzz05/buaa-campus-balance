name: 发布 macOS 版
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ./tests/run-native.sh
      - name: Build app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]
          DEVELOPER_DIR="$(xcode-select -p)" APP_VERSION="$VERSION" ./desktop/widget/build-with-widget.sh "$RUNNER_TEMP/校园余额-v$VERSION.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/校园余额-v$VERSION.app"
          test -d "$RUNNER_TEMP/校园余额-v$VERSION.app/Contents/PlugIns/CampusBalanceWidget.appex/Contents/Resources/Metadata.appintents"
          mkdir "$RUNNER_TEMP/dmg-content"
          cp -R "$RUNNER_TEMP/校园余额-v$VERSION.app" "$RUNNER_TEMP/dmg-content/"
          ln -s /Applications "$RUNNER_TEMP/dmg-content/Applications"
          hdiutil create -volname "校园余额 v$VERSION" -srcfolder "$RUNNER_TEMP/dmg-content" -format UDZO "$RUNNER_TEMP/CampusBalance-v$VERSION-macOS-arm64.dmg"
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            gh release create "$GITHUB_REF_NAME" --draft --title "校园余额 ${GITHUB_REF_NAME}" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "校园余额 ${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/CampusBalance-v${GITHUB_REF_NAME#v}-macOS-arm64.dmg"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
