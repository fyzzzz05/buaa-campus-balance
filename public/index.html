<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 · 校园余额</title>
<style>
:root { color-scheme: light dark; --bg:#eceff4; --panel:#fff; --ink:#18212f; --muted:#657184; --line:#d9dfe8; --accent:#315eea; --primary:#18212f; --primary-ink:#fff; --error:#be392b }
@media (prefers-color-scheme:dark) { :root { --bg:#0f141c; --panel:#171e29; --ink:#eaeff7; --muted:#a5afbf; --line:#384252; --accent:#557bff; --primary:#eef1f6; --primary-ink:#111824; --error:#f0836f } }
* { box-sizing:border-box }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif }
.card { width:min(440px,100%); padding:36px; border:1px solid var(--line); border-radius:26px; background:var(--panel) }
.brand { width:60px; height:60px; margin:0 auto 20px; display:grid; place-items:center; border-radius:20px; color:white; background:var(--accent) }
h1 { margin:0 0 30px; text-align:center; font-size:25px; letter-spacing:.02em }
.field { display:grid; gap:9px; margin-bottom:20px }
.field label { font-size:14px; font-weight:600 }
.input { position:relative }
.input input { width:100%; height:50px; padding:0 17px; border:1px solid var(--line); border-radius:25px; background:transparent; color:var(--ink); font:inherit; font-size:15px }
.input input::placeholder { color:var(--muted) }
#pwd { padding-right:52px }
.toggle { position:absolute; top:5px; right:7px; width:40px; height:40px; display:grid; place-items:center; border:0; border-radius:50%; background:transparent; color:var(--muted); cursor:pointer }
.toggle .off, .toggle.on .eye { display:none }
.toggle.on .off { display:block }
.options { display:grid; gap:14px; margin:23px 0 26px }
.option { display:flex; align-items:center; gap:10px; color:var(--ink); font-size:14px; cursor:pointer }
.option input { width:19px; height:19px; margin:0; accent-color:var(--accent) }
button, a { font:inherit }
.go,.sso { width:100%; height:50px; display:flex; justify-content:center; align-items:center; gap:9px; border-radius:25px; font-size:15px; font-weight:650; cursor:pointer; text-decoration:none }
.go { border:0; background:var(--primary); color:var(--primary-ink) }
.go:hover { opacity:.86 }
.go:disabled { opacity:.6; cursor:wait }
.sso { border:1px solid var(--line); background:transparent; color:var(--ink) }
.sso:hover { border-color:var(--accent) }
.divider { display:flex; align-items:center; gap:14px; margin:26px 0; color:var(--muted); font-size:13px; white-space:nowrap }
.divider::before,.divider::after { content:""; height:1px; flex:1; background:var(--line) }
.msg { margin:12px 0 0; font-size:13px; line-height:1.5; color:var(--error) }
.msg:empty { display:none }
.msg.info { color:var(--muted) }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px }
@media (max-width:480px) { body { padding:16px } .card { padding:30px 24px } }
</style>
</head>
<body>
<main class="card">
  <div class="brand" aria-hidden="true"><svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 12 4l9 5-9 5-9-5Z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5M21 9v6"/></svg></div>
  <h1>欢迎回来</h1>
  <form id="login-form">
    <div class="field"><label for="user">学号 / 工号</label><div class="input"><input id="user" type="text" inputmode="numeric" autocomplete="username" placeholder="请输入学号或工号"></div></div>
    <div class="field"><label for="pwd">密码</label><div class="input"><input id="pwd" type="password" autocomplete="current-password" placeholder="请输入密码"><button class="toggle" id="toggle" type="button" aria-label="显示密码"><svg class="eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 4.1-5.1M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"/></svg></button></div></div>
    <div class="options"><label class="option"><input id="network-same" type="checkbox">校园网使用相同密码</label><label class="option"><input id="auto-login" type="checkbox">保存密码到本机钥匙串，自动重新登录</label></div>
    <button class="go" id="go" type="submit">登录 <span aria-hidden="true">→</span></button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <div class="divider">其他登录方式</div>
  <a class="sso" id="sso" href="https://www.cc-pay.cn/login?channel=BUAASSO" rel="noopener noreferrer">打开学校统一认证 ↗</a>
</main>
<script>
const user=document.getElementById('user'),pwd=document.getElementById('pwd'),msg=document.getElementById('msg'),go=document.getElementById('go');
const sso=document.getElementById('sso');
if(window.campusBridge&&typeof window.campusBridge.openSchoolLogin==='function'){sso.addEventListener('click',function(event){event.preventDefault();window.campusBridge.openSchoolLogin()})}
else if(window.__campusNative) sso.href='/sso/start';
else sso.addEventListener('click',()=>{msg.className='msg info';msg.textContent='网页模式暂不支持将学校登录状态同步到应用。'});
document.getElementById('toggle').addEventListener('click',function(){const show=pwd.type==='password';pwd.type=show?'text':'password';this.classList.toggle('on',show);this.setAttribute('aria-label',show?'隐藏密码':'显示密码')});
document.getElementById('login-form').addEventListener('submit',async function(e){
  e.preventDefault();if(go.disabled)return;
  msg.className='msg';
  if(!user.value.trim()||!pwd.value){msg.textContent='请输入学号或工号，以及密码。';(user.value.trim()?pwd:user).focus();return}
  go.disabled=true;go.textContent='登录中…';msg.textContent='';
  try{const response=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value.trim(),password:pwd.value,networkSamePassword:document.getElementById('network-same').checked,autoLogin:document.getElementById('auto-login').checked})});const result=await response.json();pwd.value='';if(!response.ok){msg.textContent=result.error||'登录失败，请重试。';return}location.assign('/dashboard')}
  catch{pwd.value='';msg.textContent='连接失败，请稍后重试。'}finally{go.disabled=false;go.innerHTML='登录 <span aria-hidden="true">→</span>'}
});
</script>
</body>
</html>
