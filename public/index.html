<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECEFF4; --panel:#FFFFFF; --ink:#18212F; --muted:#6A7587; --line:#DCE1E9;
  --accent:#2F5BEA; --on-accent:#FFFFFF; --err:#C2402D; --ok:#14804A;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F141C; --panel:#171E29; --ink:#EAEFF7; --muted:#8C98AC; --line:#262F3E;
    --accent:#4C7BFF; --on-accent:#0B1020; --err:#F0836F; --ok:#47C98A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141C; --panel:#171E29; --ink:#EAEFF7; --muted:#8C98AC; --line:#262F3E;
  --accent:#4C7BFF; --on-accent:#0B1020; --err:#F0836F; --ok:#47C98A;
}
html{height:100%}
*{box-sizing:border-box}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  display:grid;place-items:center;padding:24px;
}
.card{
  width:min(400px,100%);background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:36px 32px 28px;
}
h1{margin:0 0 6px;font-size:24px;font-weight:700}
.sub{margin:0 0 28px;font-size:14px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
label{font-size:14px;font-weight:500}
.input{position:relative}
input{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;
  border:1px solid var(--line);border-radius:12px;padding:13px 14px;
}
input::placeholder{color:var(--muted)}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.toggle{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;justify-content:center;width:36px;height:36px;
  color:var(--muted);background:none;border:0;padding:0;cursor:pointer;border-radius:8px;
}
.toggle:hover{color:var(--accent)}
.toggle svg{display:block}
.toggle .off{display:none}
.toggle.on .eye{display:none}
.toggle.on .off{display:block}
#pwd{padding-right:48px}
.toggle:focus-visible,.go:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.go{
  width:100%;margin-top:6px;font:inherit;font-size:16px;font-weight:600;
  color:var(--on-accent);background:var(--accent);border:0;border-radius:12px;padding:14px;cursor:pointer;
}
.go:hover{filter:brightness(1.08)}
.msg{min-height:20px;margin:14px 0 0;font-size:13px;line-height:1.5}
.msg.err{color:var(--err)} .msg.info{color:var(--muted)}
.back{
  display:inline-block;margin-top:20px;font-size:13px;color:var(--muted);text-decoration:none;border-radius:6px;
}
.back:hover{color:var(--accent)}
</style>
</head>
<body>
<main class="card">
  <h1>登录</h1>
  <p class="sub">登录后查看校园卡、流量和电费余额。</p>

  <div class="field">
    <label for="user">学号 / 工号</label>
    <input id="user" type="text" inputmode="numeric" autocomplete="username" placeholder="请输入学号或工号">
  </div>
  <div class="field">
    <label for="pwd">密码</label>
    <div class="input">
      <input id="pwd" type="password" autocomplete="current-password" placeholder="请输入密码">
      <button class="toggle" id="toggle" type="button" aria-label="显示密码">
        <svg class="eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 4.1-5.1M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M2 2l20 20"/></svg>
      </button>
    </div>
  </div>

  <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:18px"><input id="network-same" type="checkbox" style="width:auto">校园网使用相同密码</label>
  <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:18px"><input id="auto-login" type="checkbox" style="width:auto">保存密码到本机钥匙串，自动重新登录</label>

  <button class="go" id="go" type="button">登录</button>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <a class="back" id="back" href="/dashboard">返回仪表盘</a>
</main>
<script>
const user = document.getElementById('user');
const pwd = document.getElementById('pwd');
const msg = document.getElementById('msg');
const go = document.getElementById('go');
document.getElementById('toggle').addEventListener('click', function () {
  const show = pwd.type === 'password';
  pwd.type = show ? 'text' : 'password';
  this.classList.toggle('on', show);
  this.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
});
async function submit() {
  if (go.disabled) return;
  if (!user.value.trim() || !pwd.value) {
    msg.className = 'msg err'; msg.textContent = '请输入学号或工号，以及密码。';
    (user.value.trim() ? pwd : user).focus(); return;
  }
  go.disabled = true; go.textContent = '登录中…'; msg.className = 'msg info'; msg.textContent = '';
  try {
    const response = await fetch('/api/auth', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value.trim(),password:pwd.value,networkSamePassword:document.getElementById('network-same').checked,autoLogin:document.getElementById('auto-login').checked})});
    const result = await response.json();
    pwd.value = '';
    if (!response.ok) {msg.className='msg err';msg.textContent=result.error || '登录失败，请重试。';return;}
    location.assign('/dashboard');
  } catch {pwd.value='';msg.className='msg err';msg.textContent='连接失败，请稍后重试。';}
  finally {go.disabled=false;go.textContent='登录';}
}
go.addEventListener('click', submit);
[user,pwd].forEach(el => el.addEventListener('keydown', e => {if(e.key === 'Enter') submit();}));
</script>
</body>
</html>
